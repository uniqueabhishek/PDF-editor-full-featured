[project]
name = "ultra-pdf-editor"
version = "1.0.0"
description = "Free, offline desktop PDF editor: edit text, annotate, merge, split, OCR and protect PDFs"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
keywords = ["pdf", "pdf-editor", "pyqt6", "pymupdf", "ocr", "annotation", "desktop"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Win32 (MS Windows)",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business",
    "Topic :: Multimedia :: Graphics :: Viewers",
]
dependencies = [
    # Core GUI Framework
    "PyQt6>=6.6.0",

    # PDF rendering & manipulation (fitz)
    "PyMuPDF>=1.23.0",

    # Image processing (page rasterisation for OCR / export)
    "Pillow>=10.2.0",

    # OCR
    "pytesseract>=0.3.10",    # OCR wrapper for Tesseract

    # Word export
    "python-docx>=1.1.0",

    # Utilities
    "send2trash>=1.8.0",      # Safe file deletion
    "darkdetect>=0.8.0",      # System theme detection
]

[project.urls]
Homepage = "https://github.com/uniqueabhishek/PDF-editor-full-featured"
Documentation = "https://github.com/uniqueabhishek/PDF-editor-full-featured/blob/main/docs/USER_GUIDE.md"
Issues = "https://github.com/uniqueabhishek/PDF-editor-full-featured/issues"
Changelog = "https://github.com/uniqueabhishek/PDF-editor-full-featured/blob/main/CHANGELOG.md"

[project.scripts]
ultra-pdf-editor = "Ultra_PDF_Editor:main"

[tool.uv]
# Windows Smart App Control blocks unsigned executables. uv's managed CPython
# builds (python-build-standalone) are NOT code-signed, so their pythonw.exe is
# blocked when launching the GUI via file association. python.org installers are
# PSF-signed, so force uv to use the signed system interpreter, never a managed one.
python-preference = "only-system"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pre-commit>=4.6.2",
    "pytest>=8.0.0",
    "pytest-qt>=4.2.0",
    "ruff>=0.16",
]

[tool.ruff]
line-length = 100
target-version = "py310"
# Leave the hand-aligned code samples in the docs alone.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "PL", "UP", "B", "BLE", "SIM", "RUF"]
ignore = [
    "PLR2004",
    "PLR0913",
    "PLR0917", # same rule as PLR0913, counted on positional arguments only
    "E501",
    "RUF001", # en dashes and the × sign in UI text are intended typography
    # Heavy modules (fitz, PIL, docx, pytesseract) are imported inside the
    # functions that use them on purpose: it keeps window start-up fast.
    "PLC0415",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR0915"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true   # pytesseract, send2trash, darkdetect have no stubs
check_untyped_defs = true
explicit_package_bases = true  # tests/ has no __init__.py; name its modules tests.*
exclude = "^(\\.venv|build|dist)/"

[[tool.mypy.overrides]]
# Tests patch methods and poke at internals on purpose; mypy checks the app.
module = ["tests.*", "test_tools"]
check_untyped_defs = false

[[tool.mypy.overrides]]
# PyQt6's stubs type every event-handler argument as Optional (QMouseEvent |
# None and so on), but Qt never passes None, so overrides typed with the plain
# event class are correct.
module = ["ui.*"]
disable_error_code = ["override"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
