name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report this. The more detail you give, the faster it can be fixed.

  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a PDF with ...
        2. Choose Tools → ...
        3. See the error
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Windows 11 24H2
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: App version or commit
      description: Help → About shows the version. If you run from source, `git rev-parse --short HEAD` gives the commit.

  - type: textarea
    id: log
    attributes:
      label: Log file
      description: Paste the last lines of `~/.ultra_pdf_editor/ultra_pdf.log` (on Windows, `C:\Users\<you>\.ultra_pdf_editor\ultra_pdf.log`).
      render: text

  - type: markdown
    attributes:
      value: If the problem only happens with one PDF, attach it if you can share it. Please do not attach confidential documents.
