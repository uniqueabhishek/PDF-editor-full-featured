name: Feature request
description: Suggest a new tool or an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the task or the problem, not only the solution you have in mind.
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: How could the app help?
      description: How you picture it working. Screenshots or examples from other tools are welcome.

  - type: dropdown
    id: contribute
    attributes:
      label: Would you like to work on it?
      options:
        - No, just suggesting it
        - Yes, I can open a pull request
